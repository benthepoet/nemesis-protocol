<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nemesis Protocol</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05080f;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #fps-overlay {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 10;
        font-family: ui-monospace, monospace;
        font-size: 14px;
        color: #e8eef4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="fps-overlay" aria-live="off">FPS —</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
